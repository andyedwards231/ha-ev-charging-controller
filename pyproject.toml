[project]
name = "ev-charge-controller"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "homeassistant==2026.10.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv", ".bootstrap", ".runtime", ".uv-cache", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
