name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to v<manifest version>
        required: false
        type: string

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  release:
    name: Package and publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build install archive
        run: python package.py
      - name: Check tag and package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ev_charge_controller/manifest.json"))["version"])')"
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$PUSH_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$VERSION"
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG must match manifest version v$VERSION" >&2
            exit 1
          fi
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo "Existing tag $TAG points to a different source commit" >&2
              exit 1
            }
          fi
          ARCHIVE="dist/ev-charge-controller-$VERSION.zip"
          test -f "$ARCHIVE"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ARCHIVE" \
              --title "$TAG" \
              --generate-notes \
              --target "$TARGET_COMMIT" \
              --repo "$GITHUB_REPOSITORY"
          fi
