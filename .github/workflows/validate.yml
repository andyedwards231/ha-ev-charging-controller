name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  python:
    name: Python 3.14 tests and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install development dependencies
        run: uv sync --extra dev
      - name: Run Python tests
        run: uv run pytest
      - name: Lint Python
        run: uv run ruff check custom_components tests package.py

  frontend:
    name: Card and browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run card and browser tests
        run: npm test

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate with HACS
        uses: hacs/action@22.5.0
        with:
          category: integration
          # A licence has not been chosen by the repository owner. This is a
          # custom HACS repository, not a submission to the default catalogue.
          ignore: license
