<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo EV EV Charging · local preview</title><style>
body{margin:0;background:#101820;color:#e8edf3;font-family:Arial,sans-serif;--primary-color:#35b4d7;--primary-text-color:#e8edf3;--secondary-text-color:#a1afbe;--divider-color:#354451;--ha-card-background:#18232e;--card-background-color:#18232e;--success-color:#52c99a;--warning-color:#e3b353;--error-color:#f18b8b;--input-fill-color:#13202b;--text-primary-color:#082431}
body.light{background:#f3f6f8;color:#172b3c;--primary-color:#087d9c;--primary-text-color:#172b3c;--secondary-text-color:#586a78;--divider-color:#cbd5dc;--ha-card-background:#fff;--card-background-color:#fff;--success-color:#187854;--warning-color:#977000;--error-color:#b83838;--input-fill-color:#f4f7f9;--text-primary-color:#fff}
nav{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--divider-color);background:var(--ha-card-background)}nav strong{font-size:15px;margin-right:20px}button,select{background:none;color:inherit;border:1px solid var(--divider-color);padding:10px 14px;border-radius:7px;font:inherit;cursor:pointer}button[aria-pressed=true]{border-color:var(--primary-color);color:var(--primary-color)}.preview-note{font-size:11px;color:var(--secondary-text-color);margin-left:auto}#calls{position:fixed;bottom:0;left:0;right:0;padding:6px 12px;background:var(--ha-card-background);font-size:11px;z-index:3;white-space:pre-wrap}#calls:empty{display:none}.narrow{max-width:390px;margin:auto}
</style></head><body><nav><strong>EV Charging</strong><button id="overview" aria-pressed="true">Overview</button><button id="schedule" aria-pressed="false">Schedule</button><button id="theme">Light / dark</button><select id="scenario" aria-label="Preview scenario"><option value="partial">Partial prices</option><option value="charging">Charging</option><option value="topup">Cheap top-up</option><option value="unplugged">Unplugged</option><option value="missing">Missing power</option><option value="no_rates">No rates</option><option value="unavailable">Unavailable</option></select><span class="preview-note">Local simulation · no Home Assistant connection</span></nav><div id="mount"></div><output id="calls"></output>
<script type="module">
import '../../custom_components/ev_charge_controller/frontend/ev-charge-controller-card.js';
import '../../custom_components/ev_charge_controller/frontend/ev-charge-dashboard.js';
class PreviewSwitch extends HTMLElement {connectedCallback(){if(this.firstChild)return;this.innerHTML='<input type="checkbox" aria-label="Hard price ceiling">';this.firstChild.checked=this._checked||false;this.firstChild.onchange=()=>{this._checked=this.firstChild.checked;this.dispatchEvent(new Event('change'));};}set checked(v){this._checked=v;if(this.firstChild)this.firstChild.checked=v;}get checked(){return this._checked;}set disabled(v){if(this.firstChild)this.firstChild.disabled=v;}}
customElements.define('ha-switch',PreviewSwitch);
const entry='preview-controller', prefix='ev_charge_controller';
const config={title:'Demo EV',status_entity:`sensor.${prefix}_status`,plan_entity:`sensor.${prefix}_charging_plan`,mode_entity:`select.${prefix}_charging_mode`,ready_by_entity:`datetime.${prefix}_ready_by`,max_cheap_rate_entity:`number.${prefix}_maximum_cheap_rate`,target_percent_entity:`number.${prefix}_planner_target`,boost_entity:`switch.${prefix}_boost`,hard_price_ceiling_entity:`switch.${prefix}_hard_deadline_price_ceiling`,monitoring_entity:`switch.${prefix}_monitoring_only`,automatic_control_entity:`switch.${prefix}_automatic_control`,config_entry_id:entry};
const suffixes={mode_entity:'mode',plan_entity:'plan',ready_by_entity:'deadline',max_cheap_rate_entity:'max_cheap_rate',target_percent_entity:'target_percent',boost_entity:'boost',hard_price_ceiling_entity:'hard_price_ceiling',monitoring_entity:'monitoring_only',automatic_control_entity:'automatic_control'};
const states={};
function state(key,value,attributes={}){const id=config[key];states[id]={entity_id:id,state:String(value),attributes,friendly_name:id};}
const start=Date.parse('2026-10-24T08:30:00Z');
const iso=n=>new Date(n).toISOString();
const rates=Array.from({length:27},(_,i)=>({start:iso(start+i*1800000),end:iso(start+(i+1)*1800000),price_pence:[4.62,3.1,2.5,1.8,1.6,1.5,1.2,-.18,.5,.9,1.3,2,3,4,6,12,19,30,24,17,10,8,6,4,3,1,0.47][i]}));
const schedule=rates.filter((s,i)=>i>=3&&i<=7||i>=23).map(s=>({...s,grid_energy_kwh:2.76}));
let soc=56,cost=0;
const series=[{time:iso(start),soc,cost}];
for(const slot of schedule){series.push({time:slot.start,soc,cost});soc+=3.84;cost+=slot.grid_energy_kwh*slot.price_pence/100;series.push({time:slot.end,soc,cost});}
series.push({time:rates.at(-1).end,soc,cost});
const baseAttrs={reason:'Waiting for the next selected charging window. Published slots are scheduled while later prices are unavailable.',observed_charging:false,observed_switch:false,problem:false,price_pence:4.62,price_valid:true,soc:56,car_limit:100,requested_target:100,power_kw:5.52,current_amps:24,power_basis:'Current amps × configured 230 V',home:true,connected:true,provisional:true,tariff:'E-1R-AGILE-24-10-01-D',estimated_cost:cost,shortfall:5,estimated_completion:null};
const basePlan={schedule,forecast_schedule:schedule,forecast_series:series,rates,forecast_soc:soc,forecast_cost:cost,forecast_grid_energy_kwh:schedule.length*2.76,forecast_shortfall_kwh:5,forecast_completion:null,forecast_target:100,forecast_horizon_end:rates.at(-1).end,forecast_basis:'Projection follows selected published windows at 24 A, using 92% efficiency and a 10% planning margin.',rates_warning:'Some prices before your deadline are unavailable. Scheduling uses published prices and updates automatically when more arrive.',rates_complete:false};
function reset(){state('status_entity','Waiting for selected slot',{...baseAttrs});state('plan_entity',schedule.length,{...basePlan});state('mode_entity','deadline');state('ready_by_entity','2026-10-25T08:00:00Z');state('target_percent_entity','100');state('max_cheap_rate_entity','2');for(const key of ['boost_entity','hard_price_ceiling_entity','monitoring_entity'])state(key,'off');state('automatic_control_entity','on');}
reset();
const registry=Object.entries(config).filter(([k])=>k.endsWith('_entity')).map(([k,id])=>({entity_id:id,platform:'ev_charge_controller',config_entry_id:entry,unique_id:`${entry}_${suffixes[k]||'status'}`}));
window.serviceCalls=[];
window.hass={states,config:{time_zone:'Europe/London'},locale:{language:'en-GB'},themes:{darkMode:true},callWS:async()=>registry,callService:async(domain,service,data)=>{window.serviceCalls.push([domain,service,data]);document.querySelector('#calls').textContent=JSON.stringify(window.serviceCalls.at(-1));if(domain==='ev_charge_controller'){for(const [field,key] of Object.entries({mode:'mode_entity',max_cheap_rate:'max_cheap_rate_entity',target_percent:'target_percent_entity',deadline:'ready_by_entity',hard_price_ceiling:'hard_price_ceiling_entity'})){if(data[field]!==undefined)state(key,field==='hard_price_ceiling'?(data[field]?'on':'off'):data[field]);}}else if(domain==='switch'){const key=Object.keys(config).find(k=>config[k]===data.entity_id);if(key)state(key,service==='turn_on'?'on':'off');}window.dashboard.hass={...window.hass};}};
let page='overview';
window.showPage=p=>{page=p;window.dashboard=document.createElement('ev-charge-dashboard');window.dashboard.setConfig({...config,page});window.dashboard.hass=window.hass;document.querySelector('#mount').replaceChildren(window.dashboard);for(const id of ['overview','schedule'])document.querySelector('#'+id).setAttribute('aria-pressed',id===page);};
window.refresh=()=>window.dashboard.hass={...window.hass};
showPage(page);
document.querySelector('#overview').onclick=()=>showPage('overview');document.querySelector('#schedule').onclick=()=>showPage('schedule');
document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('light');hass.themes={darkMode:!document.body.classList.contains('light')};refresh();};
document.querySelector('#scenario').onchange=e=>{reset();const s=e.target.value;if(s==='charging')state('status_entity','Charging confirmed',{...baseAttrs,observed_charging:true});if(s==='unplugged')state('status_entity','Unplugged',{...baseAttrs,connected:false});if(s==='topup')state('mode_entity','cheap_top_up');if(s==='missing')state('plan_entity',0,{...basePlan,forecast_series:[],forecast_soc:null,forecast_cost:null,forecast_grid_energy_kwh:null,forecast_basis:'Waiting for fresh battery and charging power data.'});if(s==='no_rates')state('plan_entity',0,{...basePlan,rates:[],forecast_series:[],forecast_schedule:[],forecast_soc:null,forecast_cost:null,rates_warning:'No published prices are available. The controller will replan when rates update.'});if(s==='unavailable')state('status_entity','unavailable');refresh();};
</script></body></html>
